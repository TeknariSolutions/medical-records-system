<div class="modal-header">
  <h5 class="modal-title">{{ orderToEdit ? 'Editar Orden Médica' : 'Crear Orden Médica' }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="orderForm">

    <h6>Detalles de la Orden</h6>
    <div formArrayName="details">
      <div *ngFor="let detail of details.controls; let i = index" [formGroupName]="i" class="card-custom border p-2 mb-4 rounded">

        <!-- Título  -->
        <div class="title-card">
          <h5 class="mb-3">Orden {{ i + 1 }}</h5>

          @if(!orderToEdit) {
            <button class="btn btn-sm btn-soft-danger" (click)="removeDetail(i)" *ngIf="details.length > 1" data-bs-toggle="tooltip"
              data-bs-placement="top" title="Eliminar">
              <i class="mdi mdi-delete-outline"></i>
            </button>
          }
        </div>

        <!-- Autocomplete de CUPS -->
        <div class="mb-2 position-relative">
          <label>CUPS</label>
          <input type="text" class="form-control" [formControlName]="'cupsName'" placeholder="Busque un CUPS"
            (input)="onCupsInput($event.target.value, i)" (keydown.enter)="$event.preventDefault()" />
        
          <!-- Sugerencias -->
          <ul class="list-group position-absolute w-100" *ngIf="showCupsDropdown[i] && cupsSuggestions[i]?.length > 0">
            <li class="list-group-item" *ngFor="let c of cupsSuggestions[i]" (click)="selectCups(c, i)">
              {{ c.code }} - {{ c.name }}
            </li>
          
            <li class="li-custom d-flex justify-content-between align-items-center">
              <button type="button" class="btn btn-sm btn-light" (click)="previousCupsPage(i)"
                [disabled]="cupsPaginator[i].pageIndex === 1">
                Anterior
              </button>
          
              <span>Página {{ cupsPaginator[i].pageIndex }} de {{ totalCupsPagesByDetail[i] || 1 }}</span>
          
              <button type="button" class="btn btn-sm btn-light" (click)="nextCupsPage(i)"
                [disabled]="cupsPaginator[i].pageIndex >= (totalCupsPagesByDetail[i] || 1)">
                Siguiente
              </button>
            </li>
          </ul>

        </div>


        <div class="mb-2">
          <label>Descripción del Procedimiento</label>
          <input type="text" class="form-control" formControlName="procedureDescription">
        </div>

        <div class="row g-2">
          <div class="col">
            <label>Cantidad</label>
            <input type="number" class="form-control" formControlName="quantity">
          </div>
        </div>

        <div class="row mt-2">
            <div class="col-12">
                <label>Instrucciones</label>
                <textarea class="form-control" formControlName="instructions"></textarea>
            </div>
        </div>

      </div>
    </div>

    <!-- Observaciones -->
    <div class="mb-3">
      <label for="generalObservations" class="form-label">Observaciones Generales</label>
      <textarea id="generalObservations" formControlName="generalObservations"
        class="form-control" rows="3"></textarea>
    </div>


    <button type="button" class="btn btn-primary mt-2" (click)="addDetail()">
      <i class="mdi mdi-plus mr-1"></i>
      Agregar
    </button>

  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light" (click)="close()">Cancelar</button>
  <button type="button" class="btn btn-primary" (click)="onSubmit()">
    {{ orderToEdit ? 'Actualizar' : 'Guardar' }}
  </button>
</div>
