<div class="container-fluid">
     <!-- Breadcrumb -->
    <div class="row">
        <div class="col-12">
            <div class="page-title-box d-flex align-items-center justify-content-between">
                <!-- <span class="mb-0">Parametrización</span> -->
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item">
                            <a [routerLink]="['/parametrization/patients']" class="text-decoration-none text-dark">
                                Historia Clinica
                            </a>
                        </li>
                        <li class="breadcrumb-item active">Procedimientos por Consulta</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

     <!-- Consultation Info -->
        <div class="card info-title">
        <div class="card-body">
            <h4 class="card-title mb-3 text-center title-custom">
            INFORMACION DE CONSULTA
            </h4>

            <div class="row">
            <div class="col-12">
                <div class="info-group">
                <div class="info-row">
                    <span class="info-label">Motivo de Consulta:</span>
                    <span class="info-value">{{ consultationData?.consultationReason || '-' }}</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Enfermedad Actual:</span>
                    <span class="info-value">{{ consultationData?.currentIllness || '-' }}</span>
                </div>
                </div>
            </div>
            </div>
        </div>
        </div>


    <!-- Cards de navegación -->
    <div class="row" *ngIf="!showPrescriptions && !showOrders">
        <button class="btn btn-outline-secondary mb-3 button-back" (click)="goBackToProcedures()">
            <i class="mdi mdi-chevron-left"></i>
            Volver al inicio
        </button>
    
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card justify-content-center custom-card text-center p-3" (click)="openPrescriptions()">
                    <i class="ri-mental-health-line"></i>
                    <h4 class="card-title mt-2">Prescripciones</h4>
                </div>
            </div>
    
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card justify-content-center custom-card text-center p-3" (click)="openOrders()">
                    <i class="ri-health-book-line"></i>
                    <h4 class="card-title mt-2">Ordenes Médicas</h4>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Componente Prescription -->
    <div *ngIf="showPrescriptions">
        <button class="btn btn-outline-secondary mb-3 button-back" (click)="goHome()">
            <i class="mdi mdi-chevron-left"></i>
            Volver al inicio
        </button>
    
        <app-prescriptions [idMedicalConsultation]="consultationData?.idMedicalConsultation"
            [consultationData]="consultationData" [patientData]="patientData">
        </app-prescriptions>
    </div>
    
    <!-- Componente Ordenes Medicas -->
    <div *ngIf="showOrders">
        <button class="btn btn-outline-secondary mb-3 button-back" (click)="goHome()">
            <i class="mdi mdi-chevron-left"></i>
            Volver al inicio
        </button>
    
        <app-orders [idMedicalConsultation]="consultationData?.idMedicalConsultation" [consultationData]="consultationData">
        </app-orders>
    </div>


</div>
