<div class="modal-header">
  <h4 class="modal-title">
    {{ isEditMode ? 'Actualizar' : 'Registrar' }} Equipo Médico
  </h4>
  <button type="button" class="btn-close" (click)="bsModalRef.hide()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="equipmentForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="container-fluid">
      <div class="row">

        <!-- Nombre del Equipo -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Nombre del equipo</label>
          <input type="text" class="form-control" formControlName="equipmentName"
            [ngClass]="{'is-invalid': submitted && equipmentForm.get('equipmentName')?.invalid}">
          <div *ngIf="submitted && equipmentForm.get('equipmentName')?.invalid" class="invalid-feedback">
            El nombre del equipo es requerido.
          </div>
        </div>

        <!-- Marca -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Marca</label>
          <input type="text" class="form-control" formControlName="brand"
            [ngClass]="{'is-invalid': submitted && equipmentForm.get('brand')?.invalid}">
          <div *ngIf="submitted && equipmentForm.get('brand')?.invalid" class="invalid-feedback">
            La marca es requerida.
          </div>
        </div>

        <!-- Descripción -->
        <div class="col-md-12 mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" formControlName="description" rows="2"></textarea>
        </div>

        <!-- Stock actual -->
        <!-- <div class="col-md-6 mb-3">
          <label class="form-label">Stock actual</label>
          <input type="number" class="form-control" formControlName="currentStock" min="0">
        </div> -->

        <!-- Stock mínimo -->
        <!-- <div class="col-md-6 mb-3">
          <label class="form-label">Stock mínimo</label>
          <input type="number" class="form-control" formControlName="minimumStock" min="0">
        </div> -->

        <!-- Precio unitario -->
        <!-- <div class="col-md-6 mb-3">
          <label class="form-label">Precio unitario</label>
          <input type="number" class="form-control" formControlName="unitPrice" min="0" step="0.01">
        </div> -->

        <!-- Proveedor -->
        <!-- <div class="col-md-6 mb-3">
          <label class="form-label">Proveedor</label>
          <input type="text" class="form-control" formControlName="supplier">
        </div> -->

        <!-- Fecha de adquisición -->
        <!-- <div class="col-md-6 mb-3">
          <label class="form-label">Fecha de adquisición</label>
          <input type="date" class="form-control" formControlName="acquisitionDate">
        </div> -->

        <!-- Fecha de vencimiento -->
        <!-- <div class="col-md-6 mb-3">
          <label class="form-label">Fecha de vencimiento</label>
          <input type="date" class="form-control" formControlName="expirationDate">
        </div> -->

        <!-- Activo -->
        <div class="col-md-6 mb-3 d-flex align-items-center">
          <div class="form-check mt-4">
            <input type="checkbox" class="form-check-input" formControlName="isActive" id="isActive">
            <label class="form-check-label" for="isActive">Activo</label>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="d-flex justify-content-end mt-4">
        <button type="button" class="btn btn-light me-2" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary">
          {{ isEditMode ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>
    </div>
  </form>
</div>
